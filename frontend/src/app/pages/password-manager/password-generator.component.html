<div class="password-generator-panel">
  <div class="generator-header">
    <span>Password Generator</span>
    <button
      type="button"
      class="icon-btn-inline"
      (click)="generate()"
      aria-label="Regenerate password"
      title="Regenerate"
    >
      <i class="pi pi-refresh"></i>
    </button>
  </div>

  <div class="generated-preview input-group">
    <input type="text" [value]="generated" readonly aria-label="Generated password" />
  </div>

  <p *ngIf="error" class="field-error">{{ error }}</p>

  <div class="strength-bar" *ngIf="!error">
    <div class="strength-bar-fill" [ngClass]="strength"></div>
  </div>
  <span class="strength-label" *ngIf="!error">{{ strength }}</span>

  <label class="form-field slider-field">
    <span>Length: {{ length }}</span>
    <p-slider
      [(ngModel)]="length"
      [min]="8"
      [max]="64"
      (onChange)="onOptionChange()"
    ></p-slider>
  </label>

  <div class="generator-options">
    <label class="checkbox-field">
      <p-checkbox [(ngModel)]="useUpper" [binary]="true" (onChange)="onOptionChange()"></p-checkbox>
      <span>Uppercase (A-Z)</span>
    </label>

    <label class="checkbox-field">
      <p-checkbox [(ngModel)]="useLower" [binary]="true" (onChange)="onOptionChange()"></p-checkbox>
      <span>Lowercase (a-z)</span>
    </label>

    <label class="checkbox-field">
      <p-checkbox [(ngModel)]="useNumbers" [binary]="true" (onChange)="onOptionChange()"></p-checkbox>
      <span>Numbers (0-9)</span>
    </label>

    <label class="checkbox-field">
      <p-checkbox [(ngModel)]="useSpecial" [binary]="true" (onChange)="onOptionChange()"></p-checkbox>
      <span>Symbols (!&#64;#$...)</span>
    </label>

    <label class="checkbox-field">
      <p-checkbox [(ngModel)]="readableOnly" [binary]="true" (onChange)="onOptionChange()"></p-checkbox>
      <span>Avoid ambiguous characters (l, I, 1, O, 0)</span>
    </label>
  </div>

  <div class="generator-actions">
    <button type="button" class="secondary-btn" (click)="generate()">
      <i class="pi pi-refresh"></i>
      New password
    </button>
    <button
      type="button"
      class="primary-btn"
      [disabled]="!generated || !!error"
      (click)="copyToInput()"
    >
      <i class="pi pi-check"></i>
      Use this password
    </button>
  </div>
</div>
